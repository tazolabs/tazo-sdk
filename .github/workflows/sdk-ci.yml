name: Python SDK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Installed wheel / Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest]
        include:
          - python: '3.13'
            os: windows-latest
          - python: '3.13'
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.9.17'
      - name: Build isolated distributions
        run: uv build --no-sources
      - name: Export locked SDK test dependencies
        run: uv export --frozen --no-default-groups --group dev --no-emit-project --no-hashes --output-file sdk-requirements.txt
      - name: Install the wheel and test dependencies
        shell: bash
        run: |
          uv pip install --system -r sdk-requirements.txt
          uv pip install --system dist/tazo_sdk-*.whl
      - name: Test installed wheel, examples, and release baseline
        run: python -m pytest -q
      - name: Lint and type-check
        run: |
          ruff check .
          ruff format --check .
          mypy src/tazo examples
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.python == '3.13' && matrix.os == 'ubuntu-latest'
        with:
          name: sdk-distributions
          path: dist/

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.9.17'
      - run: uv sync --frozen --all-groups
      - name: Validate distribution metadata
        run: |
          uv build --no-sources
          uv run --frozen --group release python -m twine check dist/*
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check generated Mintlify reference
        run: uv run --frozen --group docs python scripts/sdk_reference.py --check
      - name: Build Sphinx HTML
        run: uv run --frozen --group docs sphinx-build -W --keep-going -b html docs/source docs/_build/html
